spring:
  application:
    name: koda

  datasource:
    url: ${KODA_DB_URL:jdbc:postgresql://localhost:5432/koda}
    username: ${KODA_DB_USER:koda}
    password: ${KODA_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    open-in-view: false          # evita queries lazy fora da transacao
    hibernate:
      ddl-auto: validate         # o schema pertence ao Flyway, nunca ao Hibernate
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    redis:
      host: ${KODA_REDIS_HOST:localhost}
      port: ${KODA_REDIS_PORT:6379}
      timeout: 2s

  threads:
    virtual:
      enabled: true

server:
  port: ${KODA_PORT:8080}
  error:
    include-message: never       # nao vazar detalhe interno em resposta de erro
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: strict

koda:
  security:
    jwt:
      # Sem default: a aplicacao NAO sobe sem segredo explicito (SEC-05).
      secret: ${KODA_JWT_SECRET}
      issuer: koda
      access-token-ttl: PT15M
      refresh-token-ttl: P30D
    rate-limit:
      # Limite geral por IP, para toda a API.
      requests-per-minute: 120
      # Tentativas de login antes do bloqueio temporario (SEC-06).
      login-max-attempts: 5
      login-lockout: PT15M
  cors:
    allowed-origins: ${KODA_CORS_ORIGINS:http://localhost:3000}

  ai:
    # Desabilitado por padrao: a aplicacao sobe e serve alunos sem nenhuma
    # credencial de IA. Ligar exige ANTHROPIC_API_KEY no ambiente (SEC-05).
    enabled: ${KODA_AI_ENABLED:false}
    model: claude-opus-5
    api-key: ${ANTHROPIC_API_KEY:}
    timeout: PT2M
    max-attempts: 3
    worker-interval: PT1M
    budget:
      # Circuit breaker de custo (COST-01): estourou, geracao pausa ate o dia seguinte.
      daily-limit-usd: ${KODA_AI_DAILY_BUDGET:5.00}
    pricing:
      # Precos por milhao de tokens do modelo acima. Configuravel: preco muda sem release.
      input-per-million-usd: 5.00
      output-per-million-usd: 25.00
    quality:
      # Estagio 7 do pipeline: abaixo disso o candidato e descartado.
      min-confidence: 0.75

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never        # detalhe de health e informacao de reconhecimento
  metrics:
    tags:
      application: koda

logging:
  level:
    root: INFO
    com.paccanaro.koda: INFO
    org.springframework.security: INFO
