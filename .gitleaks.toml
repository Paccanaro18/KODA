# Configuracao do gitleaks para o KODA.
#
# Herda o conjunto completo de regras padrao. A allowlist abaixo e feita por
# VALOR, nao por caminho de arquivo. A diferenca importa: liberar
# "src/test/**" inteiro faria o scanner ignorar um segredo real que alguem
# colasse num teste no futuro. Listando os valores exatos, qualquer credencial
# nova continua sendo detectada, inclusive dentro dos testes.
#
# Regra de ouro ao editar este arquivo: se houver duvida sobre um achado, a
# resposta correta e rotacionar o valor, nao adiciona-lo aqui.

title = "KODA gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Placeholders de documentacao e credenciais efemeras de teste"

regexes = [
  # Senha usada pelos testes de integracao contra container efemero.
  '''uma-senha-bem-longa-123''',
  # Senha do Postgres do Testcontainers, viva apenas durante a suite.
  '''koda_test_password''',
  # Segredo HS256 dos testes; assina tokens que nao existem fora da suite.
  '''segredo-de-teste-apenas-com-mais-de-32-bytes-para-hs256''',
  # Segredo HS256 do CI; valido apenas dentro do runner e sem acesso a nada.
  '''ci-secret-com-mais-de-32-bytes-para-hs256-ok''',
  # Placeholders do .env.example — nunca valores reais.
  '''troque-por-[a-z-]+''',
]

paths = [
  # Arquivo de exemplo: por definicao so contem placeholders.
  '''^\.env\.example$''',
]
