name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execucoes antigas do mesmo branch: sem fila inutil em push seguido.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    # O runner ja tem Docker, que os testes com Testcontainers exigem.

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Rede de seguranca: o bit de execucao do mvnw se perde com facilidade
      # quando o arquivo e commitado a partir do Windows.
      - name: Garantir mvnw executavel
        run: chmod +x ./mvnw

      - name: Build e testes
        env:
          # Segredo exclusivo do CI. O de producao vive no secret manager.
          KODA_JWT_SECRET: ci-secret-com-mais-de-32-bytes-para-hs256-ok
        run: ./mvnw -B verify

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` em vez de `install`: falha se o lockfile divergir do
      # package.json, garantindo que o CI construa exatamente o que foi commitado.
      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  secrets-scan:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks varre o historico, nao so o working tree

      # Binario oficial em versao fixa, em vez da action de terceiro: o
      # comportamento e totalmente previsivel e o log mostra o achado exato.
      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Varrer segredos
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  dependency-scan:
    name: Vulnerabilidades em dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Falha em vulnerabilidade critica ou alta que ja tenha correcao
      # disponivel. `ignore-unfixed` evita bloquear o build por CVE que ainda
      # nao tem versao corrigida — nesse caso nao ha acao possivel.
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
